<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CitySync — My Complaints</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>

<!-- Navbar -->
<nav class="navbar">
    <a class="navbar-brand" href="index.html">
        <div class="logo-icon">🏙️</div>
        <span class="brand-name">City<span>Sync</span></span>
    </a>
    <ul class="navbar-nav">
        <li><a href="index.html">Submit</a></li>
        <li><a href="dashboard.html" class="active">My Complaints</a></li>
        <li><a href="officer.html">Officer Portal</a></li>
    </ul>
</nav>

<!-- Page Header -->
<div class="page-header">
    <div class="container">
        <h1>Complaints Dashboard</h1>
        <p>Track all submitted complaints and their resolution status in real-time.</p>
    </div>
</div>

<div class="container section">

    <!-- Email Filter -->
    <div class="card" style="margin-bottom: 1.5rem;">
        <div class="card-body" style="padding: 1rem 1.5rem;">
            <div style="display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap;">
                <div style="flex:1; min-width:200px;">
                    <label for="filter-email" style="margin-bottom:6px;">Filter by your Email</label>
                    <input type="email" id="filter-email" placeholder="your@email.com">
                </div>
                <button class="btn btn-primary" id="filter-btn">🔍 Load My Complaints</button>
                <button class="btn btn-outline" id="all-btn">Show All</button>
            </div>
        </div>
    </div>

    <!-- Stats Bar -->
    <div class="stats-bar" id="stats-bar">
        <div class="stat-card">
            <div class="stat-number" id="stat-total">—</div>
            <div class="stat-label">Total Complaints</div>
        </div>
        <div class="stat-card pending">
            <div class="stat-number" id="stat-pending">—</div>
            <div class="stat-label">Pending</div>
        </div>
        <div class="stat-card progress">
            <div class="stat-number" id="stat-progress">—</div>
            <div class="stat-label">In Progress</div>
        </div>
        <div class="stat-card resolved">
            <div class="stat-number" id="stat-resolved">—</div>
            <div class="stat-label">Resolved</div>
        </div>
    </div>

    <!-- Filter Tabs -->
    <div class="filters-bar">
        <span style="font-size:.85rem; color:var(--gray-500); font-weight:500;">Filter:</span>
        <button class="filter-btn active" data-status="">All</button>
        <button class="filter-btn" data-status="Pending">Pending</button>
        <button class="filter-btn" data-status="In Progress">In Progress</button>
        <button class="filter-btn" data-status="Resolved">Resolved</button>

        <span style="font-size:.85rem; color:var(--gray-500); font-weight:500; margin-left:8px;">Category:</span>
        <button class="filter-btn" data-category="">All</button>
        <button class="filter-btn" data-category="Road">Road</button>
        <button class="filter-btn" data-category="Garbage">Garbage</button>
        <button class="filter-btn" data-category="Water">Water</button>
        <button class="filter-btn" data-category="Electricity">Electricity</button>
    </div>

    <!-- Complaints List -->
    <div id="complaints-container">
        <div class="empty-state" id="loading-state">
            <div class="empty-icon"><span class="spinner dark" style="width:32px;height:32px;border-width:3px;"></span></div>
            <p>Loading complaints…</p>
        </div>
    </div>

</div>

<div id="toast-container"></div>

<script src="js/app.js"></script>
<script>
$(document).ready(function () {

    let currentStatus   = '';
    let currentCategory = '';
    let currentEmail    = '';

    // Load on page open
    loadComplaints();

    // Filter by email
    $('#filter-btn').on('click', function () {
        currentEmail = $('#filter-email').val().trim();
        loadComplaints();
    });

    $('#all-btn').on('click', function () {
        currentEmail = '';
        $('#filter-email').val('');
        loadComplaints();
    });

    // Status filter buttons
    $(document).on('click', '.filter-btn[data-status]', function () {
        $('.filter-btn[data-status]').removeClass('active');
        $(this).addClass('active');
        currentStatus = $(this).data('status');
        loadComplaints();
    });

    // Category filter buttons
    $(document).on('click', '.filter-btn[data-category]', function () {
        $('.filter-btn[data-category]').removeClass('active');
        $(this).addClass('active');
        currentCategory = $(this).data('category');
        loadComplaints();
    });

    function loadComplaints() {
        $('#complaints-container').html(`
            <div class="empty-state">
                <div class="empty-icon">
                    <span class="spinner dark" style="width:32px;height:32px;border-width:3px;"></span>
                </div>
                <p>Loading complaints…</p>
            </div>
        `);

        const params = {};
        if (currentStatus)   params.status = currentStatus;
        if (currentEmail)    params.email  = currentEmail;

        $.ajax({
            url:     '../backend/get_complaints.php',
            method:  'GET',
            data:    params,
            success: function (res) {
                if (!res.success) {
                    showToast('Failed to load complaints.', 'error');
                    return;
                }

                // Update stats
                $('#stat-total').text(res.stats.total);
                $('#stat-pending').text(res.stats.pending);
                $('#stat-progress').text(res.stats.in_progress);
                $('#stat-resolved').text(res.stats.resolved);

                // Filter by category client-side
                let list = res.complaints;
                if (currentCategory) {
                    list = list.filter(c => c.category === currentCategory);
                }

                if (list.length === 0) {
                    $('#complaints-container').html(`
                        <div class="empty-state">
                            <div class="empty-icon">📭</div>
                            <p>No complaints found matching your filters.</p>
                        </div>
                    `);
                    return;
                }

                let html = '<div class="complaint-list">';
                list.forEach(c => {
                    html += renderComplaintCard(c);
                });
                html += '</div>';

                $('#complaints-container').html(html);
            },
            error: function () {
                showToast('Cannot connect to server.', 'error');
                $('#complaints-container').html(`
                    <div class="empty-state">
                        <div class="empty-icon">⚠️</div>
                        <p>Server unavailable. Please ensure PHP backend is running.</p>
                    </div>
                `);
            }
        });
    }

    function renderComplaintCard(c) {
        const priorityClass = {
            'High':   'badge-high',
            'Medium': 'badge-medium',
            'Low':    'badge-low',
        }[c.priority] || 'badge-medium';

        const statusClass = {
            'Pending':     'status-pending',
            'In Progress': 'status-progress',
            'Resolved':    'status-resolved',
        }[c.status] || 'status-pending';

        const dupTag = c.is_duplicate == 1
            ? '<span class="duplicate-tag">⚠ Duplicate</span>'
            : '';

        const imgTag = c.image_path
            ? `<img src="../backend/${c.image_path}" class="complaint-image" alt="complaint photo">`
            : '';

        const locationTag = c.location
            ? `<span>📍 ${escHtml(c.location)}</span>`
            : '';

        const date = new Date(c.created_at).toLocaleDateString('en-IN', {
            day: '2-digit', month: 'short', year: 'numeric'
        });

        return `
        <div class="complaint-card ${c.is_duplicate == 1 ? 'duplicate' : ''}">
            <div class="complaint-card-header">
                <div class="complaint-card-meta">
                    <span class="complaint-id">#${c.id}</span>
                    <span class="badge ${priorityClass}">${c.priority}</span>
                    <span class="status-badge ${statusClass}">${c.status}</span>
                    ${dupTag}
                </div>
                <span class="dept-tag">${escHtml(c.department)}</span>
            </div>
            ${imgTag}
            <p class="complaint-desc">${escHtml(c.description)}</p>
            <div class="complaint-footer">
                <div style="display:flex; gap:12px; align-items:center; flex-wrap:wrap;">
                    <span>🏷️ ${escHtml(c.category)}</span>
                    ${locationTag}
                    <span>👤 ${escHtml(c.anonymous_id)}</span>
                </div>
                <span>${date}</span>
            </div>
        </div>`;
    }

    function escHtml(str) {
        if (!str) return '';
        return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
});
</script>

</body>
</html>
